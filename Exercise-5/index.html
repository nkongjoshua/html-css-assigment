<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Preview</title>
  </head>
  <body>
    <div
      style="
        background-color: rgb(22, 24, 28);
        color: rgb(231, 233, 234);
        padding: 16px;
        border-radius: 10px;
      "
    >
      <p>
        Dark Theme: Perfect for late-night coding sessions and reducing eye
        strain.
      </p>
      <div
        style="
          background-color: rgb(29, 155, 240);
          color: rgb(255, 255, 255);
          padding: 8px;
          border-radius: 5px;
          margin-bottom: 5px;
        "
      >
        <p>
          Blue Theme: Professional and modern, great for business applications
        </p>
      </div>
      <div
        style="
          background-color: rgb(249, 24, 128);
          color: rgb(255, 255, 255);
          padding: 8px;
          border-radius: 5px;
        "
      >
        <p>
          Accent Theme: Bold and energetic, perfect for call-to-action elements
        </p>
      </div>
    </div>
  </body>
</html>
