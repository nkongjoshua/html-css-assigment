<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Title Card</title>
  </head>
  <body
    style="
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #000;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <main
      style="
        width: 620px;
        box-sizing: border-box;
        background-color: rgb(22, 24, 28);
        border: 1px solid rgb(47, 51, 54);
        border-radius: 10px;
        padding: 28px;
      "
    >
      <section
        style="
          border: 1px solid rgb(47, 51, 54);
          border-radius: 10px;
          padding: 28px;
          text-align: center;
        "
      >
        <h1
          style="
            margin: 0 0 10px;
            color: rgb(231, 233, 234);
            font-size: 20px;
            font-weight: 800;
          "
        >
          Sarah Chen
        </h1>
        <p
          style="
            margin: 0;
            color: rgb(113, 118, 123);
            font-size: 15px;
            font-weight: normal;
          "
        >
          Frontend Developer &amp; UI Designer
        </p>
      </section>
    </main>
  </body>
</html>
