<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp-Style Chat Bubbles</title>
  </head>
  <body
    style="
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #000;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <main
      style="
        width: 620px;
        box-sizing: border-box;
        background-color: rgb(22, 24, 28);
        border: 1px solid rgb(47, 51, 54);
        border-radius: 10px;
        padding: 32px 24px;
        overflow: auto;
      "
    >
      <p
        style="
          float: left;
          clear: both;
          max-width: 70%;
          margin: 8px 0;
          padding: 12px 16px;
          border-radius: 18px;
          background-color: rgb(47, 51, 54);
          color: rgb(231, 233, 234);
        "
      >
        Hey! How's your coding project going?
      </p>
      <p
        style="
          float: right;
          clear: both;
          max-width: 70%;
          margin: 8px 0;
          padding: 12px 16px;
          border-radius: 18px;
          background-color: rgb(29, 155, 240);
          color: rgb(255, 255, 255);
        "
      >
        Going great! Just finished the CSS styling.
      </p>
      <p
        style="
          float: left;
          clear: both;
          max-width: 70%;
          margin: 8px 0;
          padding: 12px 16px;
          border-radius: 18px;
          background-color: rgb(47, 51, 54);
          color: rgb(231, 233, 234);
        "
      >
        That's awesome! Can't wait to see it.
      </p>
      <p
        style="
          float: right;
          clear: both;
          max-width: 70%;
          margin: 8px 0;
          padding: 12px 16px;
          border-radius: 18px;
          background-color: rgb(29, 155, 240);
          color: rgb(255, 255, 255);
        "
      >
        Thanks! I'll show you tomorrow.
      </p>
    </main>
  </body>
</html>
