<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nested Box-Model Puzzle</title>
  </head>
  <body
    style="
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #000;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <main
      style="
        width: min(620px, calc(100% - 32px));
        box-sizing: border-box;
        box-sizing: border-box;
        background-color: rgb(22, 24, 28);
        border: 1px solid rgb(47, 51, 54);
        border-radius: 10px;
        padding: 40px;
        box-sizing: border-box;
      "
    >
      <div
        style="
          display: inline-block;
          background-color: rgb(29, 155, 240);
          border: none;
          border-radius: 5px;
          padding: 20px;
          color: white;
        "
      >
        Box 1
        <div
          style="
            display: inline-block;
            margin-left: 16px;
            background-color: rgb(249, 24, 128);
            border: none;
            border-radius: 5px;
            padding: 15px;
          "
        >
          Box 2
          <div
            style="
              display: inline-block;
              margin-left: 12px;
              background-color: rgb(0, 186, 124);
              border: none;
              border-radius: 5px;
              padding: 10px;
            "
          >
            Box 3
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
