<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button Stack Challenge</title>
  </head>
  <body
    style="
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #000;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <main
      style="
        width: 620px;
        box-sizing: border-box;
        background-color: rgb(22, 24, 28);
        border: 1px solid rgb(47, 51, 54);
        border-radius: 10px;
        padding: 28px;
      "
    >
      <button
        style="
          width: 100%;
          margin: 6px 0;
          padding: 8px;
          background-color: rgb(29, 155, 240);
          color: rgb(255, 255, 255);
          border: 1px solid rgb(231, 233, 234);
          border-radius: 5px;
        "
      >
        Level 1 - Thin Border
      </button>
      <button
        style="
          width: 100%;
          margin: 6px 0;
          padding: 10px;
          background-color: rgb(29, 155, 240);
          color: rgb(255, 255, 255);
          border: 2px solid rgb(231, 233, 234);
          border-radius: 5px;
        "
      >
        Level 2 - Medium Border
      </button>
      <button
        style="
          width: 100%;
          margin: 6px 0;
          padding: 12px;
          background-color: rgb(29, 155, 240);
          color: rgb(255, 255, 255);
          border: 3px solid rgb(231, 233, 234);
          border-radius: 5px;
        "
      >
        Level 3 - Thick Border
      </button>
      <button
        style="
          width: 100%;
          margin: 6px 0;
          padding: 14px;
          background-color: rgb(29, 155, 240);
          color: rgb(255, 255, 255);
          border: 4px solid rgb(231, 233, 234);
          border-radius: 5px;
        "
      >
        Level 4 - Thicker Border
      </button>
      <button
        style="
          width: 100%;
          margin: 6px 0;
          padding: 16px;
          background-color: rgb(29, 155, 240);
          color: rgb(255, 255, 255);
          border: 5px solid rgb(231, 233, 234);
          border-radius: 5px;
        "
      >
        Level 5 - Thickest Border
      </button>
    </main>
  </body>
</html>
