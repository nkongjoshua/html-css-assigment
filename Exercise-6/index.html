<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button Library</title>

    <style>
      button {
        margin: 5px;
      }
    </style>
  </head>
  <body>
    <div
      style="
        padding: 10px;
        gap: 2px;
        background-color: #17181c;
        border-radius: 10px;
      "
    >
      <button
        style="
          background-color: #1d9bf0;
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 20px;
          font-weight: 600;
        "
      >
        Tweet
      </button>
      <button
        style="
          background-color: #1878f3;
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 6px;
          font-weight: 600;
          cursor: pointer;
        "
      >
        Connect on Facebook
      </button>
      <button
        style="
          background-color: #fe1611;
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 1px;
          font-weight: 300;
          cursor: pointer;
        "
      >
        Suscribe
      </button>
      <button
        style="
          background: linear-gradient(90deg, #fbc280 0%, #e060e0 100%);
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 6px;
          font-weight: 600;
        "
      >
        Follow
      </button>
      <button
        style="
          background-color: #1db954;
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 20px;
          font-weight: 600;
        "
      >
        Play on Spotify
      </button>
      <button
        style="
          background-color: #24292d;
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 6px;
          font-weight: 300;
        "
      >
        View on GitHub
      </button>
      <button
        style="
          background-color: #0077b4;
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 6px;
          font-weight: 600;
        "
      >
        Connect
      </button>
      <button
        style="
          background-color: #5865f2;
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 3px;
          font-weight: 600;
        "
      >
        Join Server
      </button>
      <button
        style="
          background-color: #26d367;
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 6px;
          font-weight: 600;
        "
      >
        Message
      </button>
      <button
        style="
          background-color: #000000;
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 6px;
          font-weight: 600;
        "
      >
        Follow on TikTok
      </button>
      <button
        style="
          background-color: #fe9900;
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 6px;
          font-weight: 300;
        "
      >
        Add to Cart
      </button>
      <button
        style="
          background-color: #e50913;
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 6px;
          font-weight: 600;
        "
      >
        Watch Now
      </button>
      <button
        style="
          background-color: #4a154b;
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 6px;
          font-weight: 600;
        "
      >
        Open in Slack
      </button>
      <button
        style="
          background-color: #2d8cff;
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 10px;
          font-weight: 300;
        "
      >
        Join Meeting
      </button>
      <button
        style="
          background-color: #007bff;
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 14px;
          font-weight: 600;
        "
      >
        Continue with Apple
      </button>
      <button
        style="
          background-color: #ffffff;
          color: #000;
          padding: 12px 24px;
          border: none;
          border-radius: 6px;
          font-weight: 300;
        "
      >
        Sign in with Google
      </button>
      <button
        style="
          background-color: #0178d4;
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 2px;
          font-weight: 600;
        "
      >
        Sign in with Microsoft
      </button>
      <button
        style="
          background-color: #000000;
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 6px;
          font-weight: 300;
        "
      >
        Request Ride
      </button>
      <button
        style="
          background-color: #ff5a60;
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 6px;
          font-weight: 600;
        "
      >
        Book Now
      </button>
      <button
        style="
          background-color: #bd081b;
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 24px;
          font-weight: 600;
        "
      >
        Save Pin
      </button>
    </div>
  </body>
</html>
