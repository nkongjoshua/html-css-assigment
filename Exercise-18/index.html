<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Announcement Panel</title>
  </head>
  <body
    style="
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #000;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <main
      style="
        width: 620px;
        box-sizing: border-box;
        background-color: rgb(22, 24, 28);
        border: 1px solid rgb(47, 51, 54);
        border-radius: 10px;
        padding: 32px 24px;
      "
    >
      <section
        style="
          position: relative;
          padding: 20px 56px 20px 24px;
          background-color: rgb(249, 24, 128);
          color: rgb(255, 255, 255);
          border-radius: 10px;
          font-weight: 700;
        "
      >
        System Maintenance: Scheduled downtime tonight from 2-4 AM
        <button
          type="button"
          aria-label="Close announcement"
          style="
            position: absolute;
            right: 16px;
            top: 50%;
            width: 24px;
            height: 24px;
            transform: translateY(-50%);
            border: 1px solid white;
            border-radius: 50%;
            background: transparent;
            color: white;
            line-height: 1;
          "
        >
          x
        </button>
      </section>
    </main>
  </body>
</html>
