<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motivational paragraph</title>
  </head>
  <body>
    <div
      style="
        border: 1px solid #282828;
        border-radius: 10px;
        padding: 16px;
        background-color: #191919;
        font-family: Arial, Helvetica, sans-serif;
      "
    >
      <p
        style="
          color: rgb(231, 233, 234);
          font-size: 17px;
          font-weight: 500;
          line-height: 1.6;
        "
      >
        Technology has the power to transform lives and solve complex problems.
        Every line of code I write brings me closer to creating solutions that
        matter. i belive in continuous learning, collaboration, and using
        technology as a force for good in our world
      </p>
    </div>
