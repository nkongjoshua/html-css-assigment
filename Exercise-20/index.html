<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Profile Showcase</title>
  </head>
  <body
    style="
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #000;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <main
      style="
        width: 620px;
        box-sizing: border-box;
        box-sizing: border-box;
        background-color: rgb(22, 24, 28);
        border: 1px solid rgb(47, 51, 54);
        border-radius: 10px;
        padding: 28px;
      "
    >
      <h1
        style="
          margin: 0 0 18px;
          color: rgb(231, 233, 234);
          font-size: 28px;
          font-weight: 800;
        "
      >
        Maria Santos
      </h1>
      <p
        style="
          max-width: 560px;
          margin: 0 0 24px;
          color: rgb(231, 233, 234);
          font-size: 17px;
          line-height: 1.5;
        "
      >
        Passionate about creating beautiful, functional web experiences that
        delight users and solve real-world problems. Always learning, always
        growing.
      </p>
      <div style="margin-bottom: 24px">
        <button
          style="
            margin-right: 12px;
            padding: 12px 24px;
            background-color: rgb(29, 155, 240);
            color: rgb(255, 255, 255);
            border: 0;
            border-radius: 999px;
          "
        >
          Hire Me
        </button>
        <button
          style="
            margin-right: 12px;
            padding: 12px 24px;
            background-color: transparent;
            color: rgb(29, 155, 240);
            border: 1px solid rgb(29, 155, 240);
            border-radius: 999px;
          "
        >
          View Portfolio
        </button>
        <button
          style="
            padding: 12px 24px;
            background-color: rgb(249, 24, 128);
            color: rgb(255, 255, 255);
            border: 0;
            border-radius: 999px;
          "
        >
          Contact
        </button>
      </div>
      <a
        href="#"
        style="
          margin-right: 32px;
          color: rgb(29, 155, 240);
          font-weight: 500;
          text-decoration: none;
        "
        onmouseover="this.style.textDecoration = 'underline'"
        onmouseout="this.style.textDecoration = 'none'"
        >LinkedIn Profile</a
      >
      <a
        href="#"
        style="
          color: rgb(29, 155, 240);
          font-weight: 500;
          text-decoration: none;
        "
        onmouseover="this.style.textDecoration = 'underline'"
        onmouseout="this.style.textDecoration = 'none'"
        >GitHub Repository</a
      >
    </main>
  </body>
</html>
