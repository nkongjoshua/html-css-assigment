<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paragraph Contrast</title>
  </head>
  <body
    style="
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #000;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <main
      style="
        width: 700px;
        box-sizing: border-box;
        background-color: rgb(22, 24, 28);
        border: 1px solid rgb(47, 51, 54);
        border-radius: 10px;
        padding: 32px;
        align-content: end;
        display: grid;
      "
    >
      <p
        style="
          display: inline-block;
          width: 48%;
          min-width: 220px;
          margin: 0 2% 16px 0;
          padding: 24px;
          border-radius: 12px;
          background-color: rgb(255, 255, 255);
          color: rgb(15, 20, 25);
          line-height: 1.5;
          vertical-align: top;
          box-sizing: border-box;
        "
      >
        Light Mode: Traditional design with dark text on light background. Easy
        to read in bright environments and familiar to most users.
      </p>
      <p
        style="
          display: inline-block;
          width: 48%;
          min-width: 220px;
          margin: 0;
          padding: 24px;
          border-radius: 12px;
          background-color: rgb(22, 24, 28);
          color: rgb(231, 233, 234);
          line-height: 1.5;
          vertical-align: top;
          box-sizing: border-box;
        "
      >
        Dark Mode: Modern approach with light text on dark background. Reduces
        eye strain and saves battery on OLED screens.
      </p>
    </main>
  </body>
</html>
