<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spacing Sequence</title>
  </head>
  <body
    style="
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #000;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <main
      style="
        width: auto;
        box-sizing: border-box;
        box-sizing: border-box;
        background-color: rgb(22, 24, 28);
        border: 1px solid rgb(47, 51, 54);
        border-radius: 10px;
        padding: 32px 24px;
        text-align: center;
      "
    >
      <button
        style="
          margin: 0 16px;
          padding: 12px 24px;
          background-color: rgb(29, 155, 240);
          color: rgb(255, 255, 255);
          border: 0;
          border-radius: 999px;
        "
      >
        Button One
      </button>
      <button
        style="
          margin: 0 16px;
          padding: 12px 24px;
          background-color: rgb(29, 155, 240);
          color: rgb(255, 255, 255);
          border: 0;
          border-radius: 999px;
        "
      >
        Button Two
      </button>
      <button
        style="
          margin: 0 16px;
          padding: 12px 24px;
          background-color: rgb(29, 155, 240);
          color: rgb(255, 255, 255);
          border: 0;
          border-radius: 999px;
        "
      >
        Button Three
      </button>
    </main>
  </body>
</html>
