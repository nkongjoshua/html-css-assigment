<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Header Banner</title>
  </head>
  <body
    style="
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #000;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <header
      style="
        width: 500px;
        box-sizing: border-box;
        background-color: rgb(22, 24, 28);
        border: 1px solid rgb(47, 51, 54);
        border-radius: 10px;
        padding: 28px;
        margin: 16px;
      "
    >
      <h1
        style="
          margin: 0 0 12px;
          color: rgb(231, 233, 234);
          font-size: 32px;
          font-weight: 800;
        "
      >
        CodeMaster Pro
      </h1>
      <p
        style="
          margin: 0;
          color: rgb(113, 118, 123);
          font-size: 17px;
          font-weight: 400;
        "
      >
        Your journey to becoming a developer starts here
      </p>
    </header>
  </body>
</html>
